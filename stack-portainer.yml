# Portainer Stack for an image that has already been built/loaded on this Docker host.
# Before deploying, build the image as: cay-gia-pha-web:1.0.23
services:
  gia-pha:
    image: cay-gia-pha-web:1.0.23
    pull_policy: never
    container_name: cay-gia-pha-web
    restart: unless-stopped
    init: true
    ports:
      - "8787:8787"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      DATA_DIR: "/var/lib/cay-gia-pha/data"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: ""
      SESSION_DAYS: "7"
      COOKIE_SECURE: "0"
      TRUST_PROXY: "0"
      MAX_BACKUP_MB: "1024"
    volumes:
      - gia_pha_storage:/var/lib/cay-gia-pha
    security_opt:
      - no-new-privileges:true

volumes:
  gia_pha_storage:
    name: cay-gia-pha-web-data
