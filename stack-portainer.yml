# Portainer Stack cho image local đã build/load trên Docker host.
# Dữ liệu và mã ứng dụng đều hiển thị dưới /opt/cay-gia-pha-web/ trên Ubuntu.
services:
  gia-pha:
    image: cay-gia-pha-web:1.0.37
    pull_policy: never
    container_name: cay-gia-pha-web
    restart: unless-stopped
    init: true
    ports:
      - "8787:8787"
    environment:
      TZ: "Asia/Ho_Chi_Minh"
      HOST: "0.0.0.0"
      PORT: "8787"
      STORAGE_ROOT: "/var/lib/cay-gia-pha"
      APP_DIR: "/var/lib/cay-gia-pha/app"
      DATA_DIR: "/var/lib/cay-gia-pha/data"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: ""
      SESSION_DAYS: "7"
      COOKIE_SECURE: "0"
      TRUST_PROXY: "0"
      MAX_BACKUP_MB: "1024"
    volumes:
      - /opt/cay-gia-pha-web:/var/lib/cay-gia-pha
    security_opt:
      - no-new-privileges:true
