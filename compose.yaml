services:
  gia-pha:
    build:
      context: .
      dockerfile: Dockerfile
    image: cay-gia-pha-web:1.0.23
    container_name: cay-gia-pha-web
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_PORT:-8787}:8787"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      DATA_DIR: "/var/lib/cay-gia-pha/data"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SESSION_DAYS: "${SESSION_DAYS:-7}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      MAX_BACKUP_MB: "${MAX_BACKUP_MB:-1024}"
    volumes:
      - gia_pha_storage:/var/lib/cay-gia-pha
    security_opt:
      - no-new-privileges:true

volumes:
  gia_pha_storage:
    name: cay-gia-pha-web-data
